services:
  - type: web
    name: cineverse
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Must satisfy package.json `engines` (>=22.18.0) and match .nvmrc, which CI
      # also reads. An older runtime trips EBADENGINE on `npm ci` and cannot run
      # the suites that import .ts directly via native type stripping.
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      # How long a seat survives a disconnect. Phones suspend the page and close
      # the socket the moment they are backgrounded, so a short window meant a
      # brief interruption cost the viewer their seat — and rejoining a room with
      # a waiting room meant asking the other person to approve them again. Two
      # minutes covers a normal interruption; presence still shows the member as
      # disconnected while it runs. Stated here rather than left to the default
      # so the deployed value is visible and tunable without a code change.
      - key: ROOM_RECONNECT_GRACE_MS
        value: "120000"
