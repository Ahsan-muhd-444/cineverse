services:
  - type: web
    name: cineverse
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Must satisfy package.json `engines` (>=22.18.0) and match .nvmrc, which CI
      # also reads. An older runtime trips EBADENGINE on `npm ci` and cannot run
      # the suites that import .ts directly via native type stripping.
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
