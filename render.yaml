services:
  - type: web
    name: cineverse
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Must satisfy package.json `engines` (>=22.18.0) and match .nvmrc, which CI
      # also reads. An older runtime trips EBADENGINE on `npm ci` and cannot run
      # the suites that import .ts directly via native type stripping.
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      # How long a seat survives a disconnect. Phones suspend the page and close
      # the socket the moment they are backgrounded, so a short window meant a
      # brief interruption cost the viewer their seat — and rejoining a room with
      # a waiting room meant asking the other person to approve them again. Two
      # minutes covers a normal interruption; presence still shows the member as
      # disconnected while it runs. Stated here rather than left to the default
      # so the deployed value is visible and tunable without a code change.
      - key: ROOM_RECONNECT_GRACE_MS
        value: "120000"
      # Voice/video ICE servers. NOT set here because a TURN relay needs real
      # credentials, which must never live in this file — add it in the Render
      # dashboard as a JSON array, e.g.
      #   [{"urls":"stun:stun.l.google.com:19302"},
      #    {"urls":"turn:turn.example.com:3478","username":"…","credential":"…"}]
      #
      # Two things to know before relying on it:
      #  * NEXT_PUBLIC_* is inlined by Next at BUILD time, so adding it to the
      #    dashboard requires a redeploy — it will not reach an existing bundle.
      #  * With no TURN the app falls back to public STUN, which cannot relay
      #    media: behind symmetric NAT / CGNAT (most mobile carriers) the
      #    handshake completes and no audio or video ever arrives.
